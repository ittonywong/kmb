<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#00695c">
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=2.0.0">
<title>KMB Real-time Arrivals</title></head><body>
<header><div class="hd"><h1 data-tr="title">KMB Real-time Arrivals</h1><div class="langw"><label for="lang" class="sr" data-tr="lang">Language</label><span class="lcode" aria-hidden="true"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.3"/><path d="M1.7 8h12.6M8 1.7c-3.2 3.6-3.2 9 0 12.6M8 1.7c3.2 3.6 3.2 9 0 12.6"/></g></svg><span id="lcodeT">EN</span></span><select id="lang" aria-label="Language"></select></div></div></header>
<div class="tabs"><button id="t1" class="on" data-tr="tab1">All routes</button><button id="t2" data-tr="tab2">My Favourites</button></div>
<div id="vR"><div class="bar"><input id="rq" type="search" placeholder="Route or place (e.g. 1A, Mong Kok)" data-ip="rsearch" autocapitalize="characters" autocomplete="off"></div>
<div id="recent" class="chips"></div><div id="rst" class="stl" data-tr="loading">Loading…</div><div id="rlist"></div><div id="rmore"></div></div>
<div id="vS" style="display:none"><div class="bar"><button id="back" data-tr="back">← All routes</button><span id="rno" class="rno"></span><button id="swap" data-tr="swap">⇄ Other direction</button></div>
<div class="bar"><select id="dir" aria-label="Direction"></select></div><div id="dtxt" class="stl dtxt"></div>
<div class="bar"><input id="q" type="search" placeholder="Search stops…" data-ip="search"><button id="r" data-tr="refresh">Refresh</button></div>
<div id="st" class="stl"></div><div id="list"></div></div>
<div id="v2" style="display:none"><div id="fst" class="stl"></div><div id="flist"></div></div>
<footer id="src"></footer>
<script src="app.js?v=2.0.0"></script>
</body></html>
